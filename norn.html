<title>Norn · painel de RevOps · Leandro Santana</title>
<meta name="description" content="Norn, painel de Revenue Operations da Ygg, construído com IA. Dados 100% fictícios.">
<meta name="theme-color" content="#0B0B0A">

<style>
/* Norn · demonstração para portfólio. Paleta Ygg (preto, off-white, laranja #FF6A00). Dados 100% fictícios. */
:root{
  --bg:#0B0B0A; --side:#080808; --top:#0B0B0A; --card:#171716; --card-2:#1C1C1B; --card-3:#242422; --hover:#232321;
  --line:rgba(243,242,238,.085); --line-2:rgba(243,242,238,.2);
  --txt:#F3F2EE; --dim:rgba(243,242,238,.74); --mute:rgba(243,242,238,.52); --faint:rgba(243,242,238,.34);
  --or:#FF6A00; --or-2:#FF8A3D; --or-soft:rgba(255,106,0,.12); --or-line:rgba(255,106,0,.35);
  --ok:#4CC38A; --ok-soft:rgba(76,195,138,.15); --warn:#E3A84A; --warn-soft:rgba(227,168,74,.16); --bad:#F2766B; --bad-soft:rgba(242,118,107,.15);
  --info:#83A9F0; --info-soft:rgba(131,169,240,.13);
  --c1:#FF8A3D; --c2:#F3F2EE; --c3:#C9B8A6; --c4:#8C8A84; --c5:#E3A84A; --c6:#B28DFF;
  --fg:#F3F2EE; --fg-2:rgba(243,242,238,.78); --fg-3:rgba(243,242,238,.55);
  --good:#4CC38A; --good-ink:#8FE0B6; --warn-ink:#F2C879; --bad-ink:#FFAB9E;
  --panel-solid:#161615; --track:rgba(243,242,238,.07); --accent:#FF6A00; --accent-soft:rgba(255,106,0,.13);
  --fv-a:#FFA060; --fv-b:#C24E00; --fv-ink:#1B0F06;
  --glow:linear-gradient(160deg,#20201E 0%,#191918 45%,#151514 100%);
  --sh:inset 0 1px 0 rgba(255,255,255,.055),inset 0 -1px 0 rgba(0,0,0,.3),0 18px 34px -20px rgba(0,0,0,.9),0 2px 6px -2px rgba(0,0,0,.45);
  --f:"Poppins",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
  --side-w:236px; --r:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--f);background:var(--bg);color:var(--txt);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--or);outline-offset:2px}
.ic{width:15px;height:15px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}
.up{color:var(--ok)} .dn{color:var(--bad)} .wa{color:var(--warn)} .mu{color:var(--mute)} .dm{color:var(--dim)} .or{color:var(--or-2)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#2A2A28;border-radius:10px;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}

/* ---------- estrutura ---------- */
.app{display:grid;grid-template-columns:var(--side-w) 1fr;height:100vh}
.side{background:var(--side);border-right:1px solid #1A1A19;display:flex;flex-direction:column;min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:14px 14px 12px;border-bottom:1px solid #1A1A19}
.logo{width:30px;height:30px;border-radius:8px;background:var(--or);display:grid;place-items:center;color:#0B0B0A;flex:none}
.logo .ic{width:18px;height:18px;stroke-width:2.4}
.brand b{display:block;font-size:14px;font-weight:800;letter-spacing:-.02em}
.brand small{display:block;font-size:10.5px;color:var(--mute);font-weight:600}
.nav{flex:1;overflow-y:auto;padding:8px 8px 14px}
.ng{font-size:9.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:#5F5D58;padding:14px 10px 5px}
.ni{position:relative;display:flex;align-items:center;gap:9px;width:100%;border:0;background:none;text-align:left;color:#A19F99;padding:6px 10px;border-radius:6px;font-size:12.5px;font-weight:600;transition:background .12s,color .12s;white-space:nowrap}
.ni:hover{background:#141413;color:#F3F2EE}
.ni.on{background:#1B1B1A;color:#fff}
.ni.on::before{content:"";position:absolute;left:-8px;top:6px;bottom:6px;width:3px;border-radius:0 3px 3px 0;background:var(--or)}
.ni.on .ic{color:var(--or)}
.ni .ic{width:14px;height:14px;opacity:.9}
.ni.lock{opacity:.35}
.ni .tag{margin-left:auto;font-size:9px;font-weight:800;letter-spacing:.04em;color:var(--warn);border:1px solid rgba(227,168,74,.4);border-radius:4px;padding:0 5px}
.me{border-top:1px solid #1A1A19;padding:10px;position:relative}
.me button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;padding:6px;border-radius:8px}
.me button:hover{background:#141413}
.me i{width:30px;height:30px;border-radius:8px;background:#1E1E1D;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:800;flex:none}
.me b{display:block;font-size:12px}
.me small{display:block;font-size:10.5px;color:var(--mute)}
.menu{position:absolute;left:10px;right:10px;bottom:58px;background:var(--card-2);border:1px solid var(--line-2);border-radius:10px;padding:6px;box-shadow:0 20px 50px rgba(0,0,0,.6);z-index:40}
.menu .mh{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);padding:6px 8px 4px}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:7px 8px;border-radius:6px;font-size:12px}
.menu button:hover{background:var(--hover)}
.menu button small{display:block;color:var(--mute);font-size:10.5px}
.menu button.on{color:var(--or-2)}

.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{height:52px;flex:none;display:flex;align-items:center;gap:10px;padding:0 18px;background:var(--top);border-bottom:1px solid var(--line)}
.burger{display:none;border:0;background:none;padding:6px;border-radius:6px}
.search{flex:0 1 360px;display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;background:var(--card);border:1px solid var(--line);border-radius:8px;color:var(--mute);cursor:text}
.search:hover{border-color:var(--line-2)}
.search span:not(.kbd){flex:1;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kbd{font-family:var(--mono);font-size:10px;border:1px solid var(--line-2);border-radius:4px;padding:0 5px;color:var(--mute)}
.top .sp{flex:1}
.tb{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 11px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-size:12px;font-weight:700;color:var(--dim);position:relative;white-space:nowrap}
.tb:hover{color:var(--txt);border-color:var(--line-2)}
.tb.or{color:var(--or-2)}
.tb .cnt{position:absolute;top:-6px;right:-6px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--or);color:#0B0B0A;font-size:10px;font-weight:800;display:grid;place-items:center}
.view{flex:1;overflow-y:auto;min-height:0;position:relative}
.page{max-width:1320px;margin:0 auto;padding:22px 26px 90px}
.crumb{font-size:11.5px;color:var(--mute);font-weight:600}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin:2px 0 14px}
.ph h1{font-size:26px;font-weight:800;letter-spacing:-.035em;line-height:1.1}
.ph p{color:var(--dim);font-size:12.5px;margin-top:4px}
.ph .chip{flex-direction:row;border:0;display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--ok);background:var(--ok-soft);border-radius:999px;padding:2px 9px;margin-left:6px}
.ph .chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
.tabs a{padding:8px 11px;font-size:12px;font-weight:700;color:var(--mute);border-bottom:2px solid transparent;white-space:nowrap}
.tabs a:hover{color:var(--txt)}
.tabs a.on{color:var(--txt);border-color:var(--or)}
.filters{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:16px}
.fl{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);font-size:11.5px;color:var(--mute)}
.fl select{border:0;background:none;font-weight:800;color:var(--txt);font-size:11.5px;cursor:pointer;-webkit-appearance:none;appearance:none;padding-right:12px;background:linear-gradient(45deg,transparent 50%,var(--mute) 50%) right 4px top 55%/4px 4px no-repeat,linear-gradient(-45deg,transparent 50%,var(--mute) 50%) right 0 top 55%/4px 4px no-repeat}
.fl select option{background:var(--card-2)}
.filters .dt{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--mute)}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:2px;gap:2px}
.seg button{border:0;background:none;padding:4px 10px;border-radius:6px;font-size:11.5px;font-weight:700;color:var(--mute)}
.seg button.on{background:var(--card-3);color:var(--txt)}
.seg button:hover:not(.on){color:var(--txt)}

/* ---------- seções e cartões ---------- */
.sec{margin:24px 0 10px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec h2{display:flex;align-items:center;gap:9px;font-size:14.5px;font-weight:800;letter-spacing:-.02em}
.sec h2 em{font-style:normal;font-family:var(--mono);font-size:10.5px;color:var(--mute);border:1px solid var(--line-2);border-radius:4px;padding:0 5px;font-weight:500}
.sec p{font-size:12px;color:var(--mute)}
.g{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.card.flat{padding:0;overflow:hidden}
.ch{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px}
.ch h3{font-size:12.5px;font-weight:800;letter-spacing:-.01em}
.ch small{font-size:11px;color:var(--mute);font-weight:500}
.ch .r{font-size:11px;color:var(--mute);text-align:right}
.alert-box{border-color:rgba(242,118,107,.45);background:linear-gradient(180deg,rgba(242,118,107,.06),var(--card) 70%)}
.k{display:flex;flex-direction:column;gap:2px}
.k .l{font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--mute)}
.k .v{font-size:24px;font-weight:800;letter-spacing:-.04em;line-height:1.15;font-variant-numeric:tabular-nums;white-space:nowrap}
.k .v.lg{font-size:32px}
.k .s{font-size:11px;color:var(--mute)}
.k svg.spk{margin-top:8px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:5px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.or{background:var(--or-soft);color:var(--or-2)}
.pill.mu{background:var(--card-3);color:var(--dim)}
.delta{font-size:10.5px;font-weight:800}
.hint{font-size:11px;color:var(--mute);margin-top:8px}
.btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:7px;border:1px solid var(--line-2);background:var(--card-2);font-size:12px;font-weight:700}
.btn:hover{border-color:var(--or-line)}
.btn.pri{background:var(--or);border-color:var(--or);color:#0B0B0A}
.btn.pri:hover{background:#FF7A1A}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn .ic{width:13px;height:13px}
.btn.sm{height:26px;padding:0 9px;font-size:11px}

/* lista de alertas na página */
.att{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.att div{position:relative;padding-left:14px;font-size:11.5px;color:var(--dim)}
.att div::before{content:"";position:absolute;left:0;top:5px;width:7px;height:7px;border-radius:50%;background:var(--c,var(--bad))}
.att b{display:block;color:var(--txt);font-size:12.5px;margin-bottom:2px}
.att a{color:var(--or-2);font-weight:700;font-size:11px;margin-left:4px;cursor:pointer}

/* barras e linhas */
.bar{height:8px;border-radius:5px;background:#232321;overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:5px;background:var(--or);width:0;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.bar .mk{position:absolute;top:-3px;bottom:-3px;width:2px;background:#F3F2EE;border-radius:1px}
.hb{display:grid;grid-template-columns:minmax(80px,140px) 1fr auto;gap:10px;align-items:center;padding:5px 0;font-size:11.5px}
.hb .vl{font-weight:800;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.hb .vl small{font-weight:500;color:var(--mute);margin-left:5px}
.bridge{display:grid;grid-template-columns:minmax(120px,170px) 96px 1fr 44px 104px;gap:12px;align-items:center;padding:8px 10px;border-top:1px solid #1F1F1E;font-size:12px}
.bridge:first-child{border-top:0}
.bridge.tot{background:var(--card-2);border-radius:8px;border-top:0;margin:2px 0}
.bridge em{display:block;font-style:normal;font-size:10.5px;color:var(--mute)}
.bridge .vl{font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
.bridge .pc{font-size:11px;color:var(--mute);text-align:right}
.fun{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.fun .st{background:var(--card-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.fun .st .l{font-size:10px;font-weight:800;letter-spacing:.1em;color:var(--mute)}
.fun .st .v{font-size:20px;font-weight:800;letter-spacing:-.03em;margin:2px 0;white-space:nowrap}
.fun .st .s{font-size:10.5px;color:var(--mute);margin-bottom:6px}
.fun .cv{font-size:10.5px;color:var(--or-2);font-weight:800}

/* tabelas */
.tw{overflow-x:auto}
.tt{display:flex;justify-content:flex-end;gap:6px;padding:8px 10px 0}
table{width:100%;border-collapse:collapse;font-size:11.5px}
th{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--card)}
th:first-child,td:first-child{text-align:left}
td{padding:7px 10px;border-bottom:1px solid #1C1C1B;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
td.l{text-align:left}
tr:last-child td{border-bottom:0}
tr.grp td{background:var(--card-2);font-weight:800;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--dim)}
tr.hl td{background:rgba(255,106,0,.06)}
tr.tot td{font-weight:800;border-top:1px solid var(--line-2)}
tbody tr:hover td{background:#191918}
td .sub{display:block;font-size:10px;color:var(--mute)}
.heat{display:inline-block;min-width:44px;padding:3px 6px;border-radius:4px;font-weight:800;font-size:10.5px;text-align:center}

/* gaveta e modais */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.drawer{position:fixed;top:0;right:0;bottom:0;width:420px;max-width:100%;background:var(--card);border-left:1px solid var(--line-2);z-index:61;display:flex;flex-direction:column;animation:slide .28s cubic-bezier(.2,.8,.2,1)}
@keyframes slide{from{transform:translateX(30px);opacity:0}}
.dh{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.dh .ico{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--or);color:#0B0B0A}
.dh b{display:block;font-size:14px}
.dh small{font-size:11px;color:var(--mute)}
.dh .x{margin-left:auto;border:0;background:none;padding:6px;border-radius:6px;color:var(--mute)}
.dh .x:hover{background:var(--hover);color:var(--txt)}
.db{flex:1;overflow-y:auto;padding:14px 16px}
.dtabs{display:flex;gap:4px;padding:8px 16px;border-bottom:1px solid var(--line);overflow-x:auto}
.dtabs button{border:0;background:none;font-size:11.5px;font-weight:700;color:var(--mute);padding:5px 9px;border-radius:6px;white-space:nowrap}
.dtabs button.on{background:var(--card-3);color:var(--txt)}
.al{border:1px solid var(--line);background:var(--card-2);border-radius:10px;padding:11px 12px;margin-bottom:10px}
.al .meta{display:flex;gap:6px;align-items:center;font-size:10.5px;color:var(--mute);margin-bottom:5px}
.al b{display:block;font-size:12.5px;margin-bottom:3px}
.al p{font-size:11.5px;color:var(--dim);margin-bottom:8px}
.al.crit{border-left:3px solid var(--bad)}
.al.med{border-left:3px solid var(--warn)}
.ai-l{border:1px solid var(--line);background:var(--card-2);border-radius:10px;padding:12px}
.ai-l .tg{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--or-2);background:var(--or-soft);padding:2px 8px;border-radius:5px;margin-bottom:10px}
.ai-l ul{list-style:none;display:grid;gap:9px}
.ai-l li{position:relative;padding-left:14px;font-size:12px;color:var(--dim);opacity:0;transform:translateY(5px);transition:all .35s}
.ai-l li.in{opacity:1;transform:none}
.ai-l li::before{content:"";position:absolute;left:0;top:6px;width:6px;height:6px;border-radius:50%;background:var(--c,var(--ok))}
.ai-l li b{color:var(--txt)}
.typing{display:inline-flex;gap:3px;padding:4px 0}
.typing i{width:5px;height:5px;border-radius:50%;background:var(--mute);animation:bl 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{50%{opacity:.25}}
.pal{position:fixed;top:12vh;left:50%;transform:translateX(-50%);width:600px;max-width:94vw;background:var(--card);border:1px solid var(--line-2);border-radius:14px;z-index:61;box-shadow:0 30px 80px rgba(0,0,0,.6);overflow:hidden;animation:fade .15s}
.pal input{width:100%;height:50px;border:0;border-bottom:1px solid var(--line);background:none;padding:0 18px;font-size:14px;outline:none}
.pal .res{max-height:52vh;overflow-y:auto;padding:6px}
.pal .it{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer}
.pal .it small{color:var(--mute);font-size:10.5px;margin-left:auto}
.pal .it.on,.pal .it:hover{background:var(--card-3)}
.pal .it span:first-child{font-weight:700}
.pal .it .q{display:block;font-size:11px;color:var(--mute);font-weight:500}
.pal .ft{display:flex;gap:14px;padding:8px 14px;border-top:1px solid var(--line);font-size:10.5px;color:var(--mute)}

/* feedback */
.fb-btn{position:fixed;right:20px;bottom:20px;z-index:50;display:flex;align-items:center;gap:9px;padding:8px 14px 8px 8px;border-radius:999px;border:1px solid var(--line-2);background:var(--card-2);box-shadow:0 12px 30px rgba(0,0,0,.5)}
.fb-btn:hover{border-color:var(--or-line)}
.fb-btn i{width:30px;height:30px;border-radius:50%;background:var(--or);display:grid;place-items:center;color:#0B0B0A}
.fb-btn b{display:block;font-size:12px;text-align:left}
.fb-btn small{display:block;font-size:10.5px;color:var(--mute);text-align:left}
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:9px 12px;border-radius:12px;font-size:12.5px;line-height:1.45;animation:fade .25s}
.msg.bot{background:var(--card-3);border-top-left-radius:4px}
.msg.me{background:var(--or);color:#0B0B0A;margin-left:auto;border-top-right-radius:4px;font-weight:600}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts button{border:1px solid var(--line-2);background:var(--card-2);border-radius:999px;padding:5px 11px;font-size:11.5px;font-weight:700}
.opts button:hover{border-color:var(--or)}
.chat-in{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.chat-in input{flex:1;height:36px;border:1px solid var(--line-2);border-radius:8px;background:var(--card-2);padding:0 12px;outline:none}
.chat-in input:focus{border-color:var(--or)}
.shot{border:1px solid var(--line-2);border-radius:8px;overflow:hidden;background:var(--bg);padding:8px;font-size:10.5px;color:var(--mute)}
.shot div{height:70px;border-radius:5px;background:linear-gradient(135deg,#1A1A19,#262624);display:grid;place-items:center;color:var(--dim);font-weight:700}

/* toast e banner */
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;z-index:90;display:flex;align-items:center;gap:9px;background:var(--card-2);border:1px solid var(--line-2);border-left:3px solid var(--or);padding:10px 14px;border-radius:10px;font-size:12px;font-weight:700;box-shadow:0 14px 34px rgba(0,0,0,.55);transition:all .3s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast small{display:block;font-weight:500;color:var(--mute);font-size:11px}
.toast .ic{color:var(--or)}
.demo-tag{white-space:nowrap;position:fixed;left:50%;bottom:6px;transform:translateX(-50%);z-index:45;font-size:9.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#0B0B0A;background:var(--or);padding:2px 10px;border-radius:999px;pointer-events:none}

/* regras, chips e chaves */
.rule{display:grid;grid-template-columns:minmax(0,1fr) minmax(220px,360px);gap:18px;padding:14px 0;border-top:1px solid var(--line)}
.rule:first-child{border-top:0}
.rule b{display:block;font-size:12.5px;margin-bottom:3px}
.rule p{font-size:11.5px;color:var(--dim)}
.rule small{display:block;font-size:10.5px;color:var(--mute);margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:5px;justify-content:flex-end;align-items:center}
.chipx{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;background:var(--card-3);border:1px solid var(--line-2);border-radius:6px;padding:2px 4px 2px 8px}
.chipx button{border:0;background:none;color:var(--mute);padding:0 3px;font-size:13px;line-height:1}
.chipx button:hover{color:var(--bad)}
.addc{display:flex;gap:6px;margin-top:6px;justify-content:flex-end;width:100%}
.addc input{height:28px;width:150px;border:1px solid var(--line-2);border-radius:6px;background:var(--card-2);padding:0 8px;font-size:11.5px;outline:none}
.sw{position:relative;width:36px;height:20px;border-radius:12px;border:0;background:var(--line-2);transition:background .2s;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s}
.sw.on{background:var(--or)}
.sw.on::after{transform:translateX(16px)}
.num-in{height:30px;width:90px;border:1px solid var(--line-2);border-radius:6px;background:var(--card-2);padding:0 8px;text-align:right;outline:none}
.num-in:focus{border-color:var(--or)}
.src{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.src:first-child{border-top:0}
.src .dot{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px var(--ok-soft);flex:none}
.src .dot.w{background:var(--warn);box-shadow:0 0 0 4px var(--warn-soft)}
.src b{display:block;font-size:12.5px}
.src small{font-size:11px;color:var(--mute)}
.src .r{margin-left:auto;text-align:right;font-size:11px;color:var(--mute)}
.spin{width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:rot .8s linear infinite;display:inline-block}
@keyframes rot{to{transform:rotate(360deg)}}
.leia h3{font-size:14px;font-weight:800;margin:18px 0 8px}
.leia p{font-size:12.5px;color:var(--dim);margin-bottom:8px;max-width:80ch}
.gl{display:grid;grid-template-columns:150px 1fr;gap:0}
.gl div{padding:8px 0;border-top:1px solid var(--line);font-size:12px}
.gl div:nth-child(odd){font-weight:800}
.gl div:nth-child(even){color:var(--dim)}
.lockpage{display:grid;place-items:center;text-align:center;padding:90px 20px;color:var(--dim)}
.lockpage .ic{width:34px;height:34px;color:var(--mute);margin-bottom:10px}
.lockpage b{display:block;color:var(--txt);font-size:16px;margin-bottom:4px}

/* abertura */
/* abertura: a mesma do produto (ponto de luz, anéis de pulso, símbolo, nome com brilho, chão em perspectiva), na paleta Ygg */
.ab-splash{position:fixed;inset:0;z-index:1000;overflow:hidden;background:#0B0B0A;color:#F3F2EE;font-family:Poppins,system-ui,sans-serif}
.ab-splash.run{animation:abFade .7s ease 5.45s forwards}.ab-splash.out{animation:abOut .26s ease forwards}
.ab-stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;overflow:hidden;background:radial-gradient(1500px 1000px at 30% 15%,#2A1A0C 0%,#151210 50%,#0B0B0A 100%)}
.ab-stage *{position:absolute}
.ab-black{inset:0;background:#000;animation:abHide .6s linear forwards}
.ab-floor{left:-540px;width:3000px;height:1300px;top:560px;transform-origin:50% 0;transform:perspective(700px) rotateX(74deg);opacity:0;background-image:linear-gradient(rgba(255,138,61,.16) 1.5px,transparent 1.5px),linear-gradient(90deg,rgba(255,138,61,.16) 1.5px,transparent 1.5px);background-size:90px 90px;-webkit-mask-image:linear-gradient(to bottom,transparent 0%,#000 30%,#000 100%);mask-image:linear-gradient(to bottom,transparent 0%,#000 30%,#000 100%);animation:abFloor 6.2s linear forwards,abShow 1.5s ease .3s forwards}
.ab-pt{width:4px;height:4px;border-radius:50%;background:#FFD2B0;opacity:0;animation:abPt 9s linear infinite}
.ab-zoom{inset:0;animation:abZoom .7s cubic-bezier(.65,0,.35,1) 5.45s forwards}
.ab-flare{left:0;top:0;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;opacity:0;background:radial-gradient(circle,#fff 0%,rgba(255,200,160,.85) 10%,rgba(255,106,0,0) 60%);transform:translate(960px,540px) scale(.3);animation:abFlare 1.9s cubic-bezier(.65,0,.35,1) .4s forwards}
.ab-flash{inset:0;opacity:0;background:radial-gradient(circle at 50% 50%,#fff,rgba(255,200,160,.6) 30%,rgba(255,106,0,0) 70%);animation:abFlash .45s linear 2.1s forwards}
.ab-ring{left:960px;top:540px;width:300px;height:300px;margin:-150px 0 0 -150px;border-radius:50%;border:2.5px solid #FF8A3D;opacity:0;animation:abRing 1.5s linear forwards}
.ab-ring.r0{animation-delay:2.1s}.ab-ring.r1{animation-delay:2.26s}.ab-ring.r2{animation-delay:2.42s}
.ab-glow{left:660px;top:120px;width:600px;height:600px;border-radius:50%;opacity:0;background:radial-gradient(circle,rgba(255,106,0,.35),rgba(255,106,0,0) 65%);animation:abShow .5s ease 2.1s forwards,abPulse 2s ease-in-out 2.6s infinite}
.ab-logo{left:880px;top:330px;width:160px;height:160px;opacity:0;filter:drop-shadow(0 20px 40px rgba(0,0,0,.5));animation:abLogo .9s cubic-bezier(.22,1,.36,1) 2.1s forwards}
.ab-logo svg{position:static;display:block;filter:blur(14px);animation:abBlur .9s cubic-bezier(.22,1,.36,1) 2.1s forwards}
.ab-name{left:0;width:1920px;top:520px;font-size:150px;line-height:1;font-weight:700;text-align:center;white-space:nowrap;letter-spacing:30px;animation:abLs 1.6s cubic-bezier(.65,0,.35,1) 2.6s forwards}
.ab-name span{position:relative;display:inline-block;opacity:0;transform:translateY(80px);animation:abUp .65s cubic-bezier(.22,1,.36,1) forwards}
.ab-sheen{color:#fff;text-shadow:0 0 30px rgba(255,138,61,.9);opacity:0;animation:abLs 1.6s cubic-bezier(.65,0,.35,1) 2.6s forwards,abSheen 1s cubic-bezier(.65,0,.35,1) 3.75s forwards;-webkit-mask-image:linear-gradient(100deg,transparent 42%,#000 50%,transparent 58%);mask-image:linear-gradient(100deg,transparent 42%,#000 50%,transparent 58%);-webkit-mask-size:300% 100%;mask-size:300% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:130% 0;mask-position:130% 0}
.ab-tag{left:0;width:1920px;top:705px;text-align:center;font-size:26px;font-weight:600;letter-spacing:14px;color:#FF8A3D;opacity:0;transform:translateY(20px);animation:abTag .7s cubic-bezier(.22,1,.36,1) 3.9s forwards}
.ab-line{left:730px;top:760px;width:460px;height:2px;transform:scaleX(0);background:linear-gradient(90deg,rgba(255,106,0,0),#FF8A3D,rgba(255,106,0,0));animation:abLine .9s cubic-bezier(.65,0,.35,1) 4s forwards}
.ab-splash:not(.run) *{animation-play-state:paused!important}
.ab-ctl{position:absolute;right:24px;bottom:22px;display:flex;gap:10px;z-index:2}
.ab-ctl button{font:500 14px Poppins,system-ui,sans-serif;color:#F3F2EE;background:rgba(20,20,19,.6);border:1px solid rgba(255,138,61,.4);border-radius:999px;padding:8px 16px;cursor:pointer}.ab-ctl button:hover{background:rgba(255,106,0,.16)}
@keyframes abHide{to{opacity:0}}@keyframes abShow{to{opacity:1}}@keyframes abFade{to{opacity:0;visibility:hidden}}@keyframes abOut{to{opacity:0}}
@keyframes abFloor{from{background-position:0 0}to{background-position:0 210px}}
@keyframes abPt{0%{opacity:0;transform:translateY(0)}20%{opacity:.45}80%{opacity:.3}100%{opacity:0;transform:translateY(-160px)}}
@keyframes abZoom{to{transform:scale(1.55);opacity:0}}
@keyframes abFlare{0%{opacity:0;transform:translate(960px,540px) scale(.3)}89.5%{opacity:1;transform:translate(960px,540px) scale(2.8)}100%{opacity:0;transform:translate(960px,540px) scale(2.8)}}
@keyframes abFlash{0%{opacity:.75}100%{opacity:0}}
@keyframes abRing{0%{opacity:.75;transform:scale(.25)}10%{opacity:.675;transform:scale(1.334)}25%{opacity:.562;transform:scale(2.562)}40%{opacity:.45;transform:scale(3.386)}55%{opacity:.337;transform:scale(3.885)}70%{opacity:.225;transform:scale(4.142)}85%{opacity:.113;transform:scale(4.236)}100%{opacity:0;transform:scale(4.25)}}
@keyframes abPulse{0%,100%{opacity:.65}50%{opacity:1}}
@keyframes abLogo{0%{opacity:0;transform:scale(1.6)}28%{opacity:1}100%{opacity:1;transform:scale(1)}}
@keyframes abBlur{to{filter:blur(0)}}@keyframes abLs{to{letter-spacing:-1px}}@keyframes abUp{to{opacity:1;transform:translateY(0)}}
@keyframes abSheen{0%{opacity:1;-webkit-mask-position:130% 0;mask-position:130% 0}99%{opacity:1}100%{opacity:0;-webkit-mask-position:-30% 0;mask-position:-30% 0}}
@keyframes abTag{to{opacity:1;transform:none;letter-spacing:7px}}@keyframes abLine{to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){.ab-splash{display:none!important}}
@media (orientation:portrait) and (max-width:768px){.ab-stage{-webkit-mask-image:linear-gradient(to bottom,transparent,#000 18%,#000 82%,transparent);mask-image:linear-gradient(to bottom,transparent,#000 18%,#000 82%,transparent)}}

/* ---------- TV ---------- */
.tv{position:fixed;inset:0;z-index:150;background:#0B0B0A;display:flex;flex-direction:column;font-size:15px}
.tv-top{display:flex;align-items:center;gap:16px;padding:12px 22px;border-bottom:1px solid var(--line);background:#0E0E0D}
.tv-top .t small{display:block;font-size:10px;font-weight:800;letter-spacing:.12em;color:var(--mute);text-transform:uppercase}
.tv-top .t b{font-size:16px}
.tv-tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
.tv-tabs button{border:0;background:none;padding:5px 12px;border-radius:999px;font-size:12px;font-weight:700;color:var(--mute)}
.tv-tabs button.on{background:var(--or);color:#0B0B0A}
.tv-top .clock{margin-left:auto;font-size:26px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.tv-prog{height:2px;background:#1A1A19}
.tv-prog i{display:block;height:100%;background:var(--or);width:0}
.tv-body{flex:1;display:grid;grid-template-columns:1fr 330px;gap:16px;padding:16px 22px 22px;min-height:0}
.tv-main{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 26px;min-height:0;overflow:hidden;animation:fade .4s}
.tv-side{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;min-height:0}
.tv-side h4{font-size:15px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.tv-side .list{flex:1;overflow:hidden;display:flex;flex-direction:column;gap:8px}
.sale{display:flex;align-items:center;gap:10px;background:var(--card-2);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;color:#0B0B0A;flex:none}
.sale b{display:block;font-size:13px}
.sale small{display:block;font-size:11px;color:var(--mute)}
.sale .v{margin-left:auto;color:var(--ok);font-weight:800;font-size:14px}
.tv .big{font-size:76px;font-weight:800;letter-spacing:-.05em;line-height:1}
.tv .lbl{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);display:flex;align-items:center;gap:8px}
.tv .lbl::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--or)}
.tv .box{background:var(--card-2);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.tv .box .v{font-size:30px;font-weight:800;letter-spacing:-.03em}
.tv .box .l{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.tv .box .s{font-size:12px;color:var(--mute)}
.rank{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:var(--card-2);border:1px solid var(--line);margin-bottom:10px}
.rank .pos{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--card-3)}
.rank.p1 .pos{background:#E3B94A;color:#0B0B0A}
.rank.p1{border-color:rgba(227,185,74,.45)}
.rank b{font-size:18px}
.rank .v{margin-left:auto;text-align:right;font-size:20px;font-weight:800}
.rank .v small{display:block;font-size:11px;color:var(--mute);font-weight:600}
.tvf{display:grid;grid-template-columns:150px 1fr 160px 70px;gap:18px;align-items:center;padding:18px 0;border-top:1px solid var(--line)}
.tvf:first-child{border-top:0}
.tvf .n{font-size:24px;font-weight:800}
.tvf .bar{height:22px;border-radius:7px}
.tvf .bar i{border-radius:7px}
.temp{border-radius:14px;padding:18px;border:1px solid var(--line)}
.temp .v{font-size:56px;font-weight:800;letter-spacing:-.04em;line-height:1}

/* ---------- responsivo ---------- */
@media(max-width:1180px){.g5,.g6{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g21,.g12{grid-template-columns:1fr}}
@media(max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:260px;z-index:70;transform:translateX(-102%);transition:transform .28s}
  .app.nav-open .side{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.55)}
  .burger{display:block}
  .search{flex:1}
  .search span,.search .kbd{display:none}
  .tb .t{display:none}
  .page{padding:16px 14px 90px}
  .g2,.g3,.g4,.g5,.g6{grid-template-columns:repeat(2,minmax(0,1fr))}
  .att{grid-template-columns:1fr}
  .fun{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bridge{grid-template-columns:minmax(90px,1fr) 84px 60px;}
  .bridge .bar,.bridge .pc{display:none}
  .rule{grid-template-columns:1fr}.chips,.addc{justify-content:flex-start}
  .tv-body{grid-template-columns:1fr}.tv-side{display:none}
  .tv .big{font-size:48px}

<script>
/* Gerador de dados 100% fictícios do Norn.
   Nada aqui vem de base real: é tudo sorteado por uma semente fixa, com tendência, sazonalidade e ruído,
   e os números são coerentes entre as telas (funil → receita → base). */
const D = (() => {
  // ---------- aleatório com semente ----------
  let s = 20261117;
  const R = () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const U = (a, b) => a + (b - a) * R();
  const N = (sd) => { let u = 0, v = 0; while (!u) u = R(); while (!v) v = R(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v) * sd; };
  const pick = (arr) => arr[Math.floor(R() * arr.length)];
  const wpick = (arr, w) => { const t = w.reduce((a, b) => a + b, 0); let r = R() * t; for (let i = 0; i < arr.length; i++) { r -= w[i]; if (r <= 0) return arr[i]; } return arr[arr.length - 1]; };
  const rd = Math.round;

  // ---------- calendário ----------
  const MES = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];
  const MESL = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
  const months = [];
  for (let y = 2025; y <= 2026; y++) for (let m = 0; m < 12; m++) { months.push({ y, m, l: `${MES[m]}/${String(y).slice(2)}` }); if (y === 2026 && m === 10) break; }
  const CUR = months.length - 1, PREV = CUR - 1; // Nov/26 é o mês corrente
  const DT = 19, DU = 11; // dias úteis de novembro/26 e dia útil de hoje (17/11)
  const PACE = DU / DT;
  const BDAYS = [3, 4, 5, 6, 9, 10, 11, 12, 13, 16, 17, 18, 19, 23, 24, 25, 26, 27, 30]; // dias úteis de nov/26
  const SEAS = [0.92, 0.95, 1.05, 1.0, 1.04, 0.98, 1.02, 1.06, 1.03, 1.08, 1.05, 0.86];

  // ---------- funil por segmento ----------
  const P = {
    smb: { mql: 240, g: 0.011, c1: 0.42, c2: 0.62, c3: 0.21, tk: 690, mrr0: 5.2e5, cli0: 760, exp: [0.010, 0.016], red: [0.005, 0.009], chu: [0.014, 0.022] },
    ent: { mql: 30, g: 0.014, c1: 0.47, c2: 0.71, c3: 0.13, tk: 2600, mrr0: 2.1e5, cli0: 70, exp: [0.015, 0.025], red: [0.004, 0.009], chu: [0.005, 0.011] },
  };
  const PERF = { smb: { mql: .78, sql: .86, opp: .93, won: .88, bk: .84 }, ent: { mql: .91, sql: .95, opp: 1.02, won: .82, bk: .80 } };
  const F = { smb: [], ent: [] }, FC = { smb: [], ent: [] }, BG = { smb: [], ent: [] }, MR = { smb: [], ent: [] }, MRF = { smb: [], ent: [] }, MRB = { smb: [], ent: [] };
  for (const sg of ['smb', 'ent']) {
    const p = P[sg];
    let start = p.mrr0, cli = p.cli0;
    months.forEach((mo, i) => {
      const tr = p.mql * (1 + p.g * i) * SEAS[mo.m];
      const mql = rd(tr * (1 + N(0.05)));
      const c1 = p.c1 * (1 + N(0.06)), c2 = p.c2 * (1 + N(0.05)), c3 = p.c3 * (1 + N(0.08));
      const sql = rd(mql * c1), opp = rd(sql * c2), won = Math.max(1, rd(opp * c3));
      const tk = p.tk * (1 + 0.004 * i) * (1 + N(0.06));
      const bk = won * tk;
      const leads = rd(mql / (0.62 + N(0.02)));
      const lost = rd(opp * (0.66 + N(0.05)));
      const trSql = tr * p.c1, trOpp = trSql * p.c2, trWon = trOpp * p.c3, trBk = trWon * p.tk * (1 + 0.004 * i);
      FC[sg][i] = { mql: rd(tr * 1.03), sql: rd(trSql * 1.03), opp: rd(trOpp * 1.03), won: rd(trWon * 1.04), bk: trBk * 1.04 };
      BG[sg][i] = { mql: rd(tr * 1.12), sql: rd(trSql * 1.12), opp: rd(trOpp * 1.12), won: rd(trWon * 1.14), bk: trBk * 1.16 };
      // receita
      const e = start * U(...p.exp), r = -start * U(...p.red), c = -start * U(...p.chu);
      const one = won * U(350, 900) * (sg === 'ent' ? 3 : 1);
      let f = { leads, mql, sql, opp, won, bk, tk, lost };
      let m = { start, bookings: bk, expansion: e, reduction: r, churn: c, oneshot: one };
      const mf = { bookings: FC[sg][i].bk, expansion: start * (p.exp[0] + p.exp[1]) / 2, reduction: -start * (p.red[0] + p.red[1]) / 2, churn: -start * (p.chu[0] + p.chu[1]) / 2 * 1.05 };
      const mb = { bookings: BG[sg][i].bk, expansion: mf.expansion * 1.1, reduction: mf.reduction * .9, churn: mf.churn * .85 };
      if (i === CUR) {
        const k = PERF[sg];
        f = { leads: rd(leads * PACE * k.mql), mql: rd(mql * PACE * k.mql), sql: rd(sql * PACE * k.sql), opp: rd(opp * PACE * k.opp), won: Math.max(1, rd(won * PACE * k.won)), bk: 0, tk, lost: rd(lost * PACE) };
        f.bk = f.won * tk * (k.bk / k.won);
        m = { start, bookings: f.bk, expansion: e * PACE * 1.04, reduction: r * PACE * .86, churn: c * PACE * .64, oneshot: one * PACE };
      }
      m.end = m.start + m.bookings + m.expansion + m.reduction + m.churn;
      const newCli = f.won, lostCli = Math.max(0, rd(-m.churn / (p.tk * (1 + 0.003 * i)) ));
      m.cliStart = cli; cli = cli + newCli - lostCli; m.clients = cli; m.newCli = newCli; m.lostCli = lostCli;
      F[sg][i] = f; MR[sg][i] = m; MRF[sg][i] = mf; MRB[sg][i] = mb;
      start = m.end;
    });
  }
  const seg2 = (sg) => sg === 'all' ? ['smb', 'ent'] : [sg];
  const sumObj = (arrs) => { const o = {}; arrs.forEach(a => Object.keys(a).forEach(k => { if (typeof a[k] === 'number') o[k] = (o[k] || 0) + a[k]; })); return o; };
  const f = (sg, i) => { const o = sumObj(seg2(sg).map(x => F[x][i])); o.tk = o.won ? o.bk / o.won : 0; return o; };
  const fc = (sg, i) => sumObj(seg2(sg).map(x => FC[x][i]));
  const bg = (sg, i) => sumObj(seg2(sg).map(x => BG[x][i]));
  // Commit dos gerentes: só existe para SMB; Enterprise usa o Forecast travado
  const cm = (sg, i) => { const a = []; if (sg !== 'ent') a.push(Object.fromEntries(Object.entries(FC.smb[i]).map(([k, v]) => [k, k === 'bk' ? v * .97 : rd(v * .98)]))); if (sg !== 'smb') a.push(FC.ent[i]); return sumObj(a); };
  const mrr = (sg, i) => sumObj(seg2(sg).map(x => MR[x][i]));
  const mrrF = (sg, i) => sumObj(seg2(sg).map(x => MRF[x][i]));
  const mrrB = (sg, i) => sumObj(seg2(sg).map(x => MRB[x][i]));
  // projeção do mês corrente no ritmo atual
  const proj = (sg) => { const a = f(sg, CUR); const o = {}; for (const k of ['leads', 'mql', 'sql', 'opp', 'won', 'bk', 'lost']) o[k] = a[k] / PACE; return o; };

  // ---------- diário do mês ----------
  const daily = {};
  for (const sg of ['smb', 'ent']) {
    daily[sg] = {};
    for (const st of ['mql', 'sql', 'opp', 'won', 'bk']) {
      const tot = F[sg][CUR][st];
      const w = Array.from({ length: DU }, (_, d) => Math.max(.2, 1 + N(.35)) * (d === DU - 1 ? .55 : 1));
      const ws = w.reduce((a, b) => a + b, 0);
      let acc = 0; const out = w.map((x, d) => { if (d === DU - 1) return st === 'bk' ? tot - acc : Math.max(0, rd(tot - acc)); const v = st === 'bk' ? tot * x / ws : rd(tot * x / ws); acc += v; return v; });
      daily[sg][st] = out;
    }
  }
  const dailyOf = (sg, st) => { const a = seg2(sg).map(x => daily[x][st]); return a[0].map((_, d) => a.reduce((t, arr) => t + arr[d], 0)); };

  // ---------- pessoas ----------
  const AE = [
    { n: 'Ana Ribeiro', sg: 'smb' }, { n: 'Bruno Melo', sg: 'smb' }, { n: 'Carla Nunes', sg: 'smb' }, { n: 'Diego Prado', sg: 'smb' },
    { n: 'Érica Lins', sg: 'smb' }, { n: 'Fábio Reis', sg: 'smb' }, { n: 'Gabriela Costa', sg: 'ent' }, { n: 'Heitor Sá', sg: 'ent' }];
  const SDR = [{ n: 'Iara Moura' }, { n: 'João Pires' }, { n: 'Kátia Leme' }, { n: 'Lucas Brito' }, { n: 'Marina Teles' }];
  const CSM = ['Nina Duarte', 'Otávio Luz', 'Paula Viana', 'Rafael Cruz'];
  const COLORS = ['#FF6A00', '#E9E7E1', '#83A9F0', '#4CC38A', '#E3A84A', '#B28DFF', '#F2766B', '#6FD3D3'];
  const ini = (n) => n.split(' ').map(x => x[0]).slice(0, 2).join('');
  (function () {
    for (const sg of ['smb', 'ent']) {
      const team = AE.filter(a => a.sg === sg);
      const w = team.map(() => U(.6, 1.5)); const ws = w.reduce((a, b) => a + b, 0);
      const won = F[sg][CUR].won, bk = F[sg][CUR].bk; const goal = sg === 'smb' ? cm('smb', CUR).bk : FC.ent[CUR].bk;
      let wa = 0;
      team.forEach((a, j) => {
        a.won = j === team.length - 1 ? won - wa : rd(won * w[j] / ws); wa += a.won;
        a.bk = bk * (a.won / Math.max(1, won)); a.meta = goal / team.length * U(.85, 1.15);
        a.opp = rd(F[sg][CUR].opp * w[j] / ws); a.conv = a.opp ? a.won / Math.max(1, a.opp) : 0;
      });
    }
    const sqlT = F.smb[CUR].sql + F.ent[CUR].sql; const w = SDR.map(() => U(.7, 1.4)); const ws = w.reduce((a, b) => a + b, 0);
    SDR.forEach((p, j) => { p.sql = rd(sqlT * w[j] / ws); p.meta = rd(cm('all', CUR).sql / SDR.length * U(.9, 1.1)); p.opp = rd(p.sql * U(.5, .72)); p.show = U(.72, .86); });
    AE.forEach((a, j) => a.c = COLORS[j % COLORS.length]); SDR.forEach((a, j) => a.c = COLORS[(j + 3) % COLORS.length]);
  })();

  // ---------- negócios em aberto ----------
  const STAGES = ['Descoberta', 'Demonstração', 'Proposta', 'Negociação'];
  const TEMPS = ['Quente', 'Morno', 'Frio', 'Sem temperatura'];
  const CANAIS_CONV = ['Formulário', 'Chat', 'Demo agendada', 'Trial', 'Outbound', 'Indicação'];
  const deals = [];
  for (let j = 0; j < 48; j++) {
    const sg = R() < .78 ? 'smb' : 'ent';
    const owner = pick(AE.filter(a => a.sg === sg));
    const stage = wpick(STAGES, [30, 34, 25, 11]);
    const temp = wpick(TEMPS, [14, 38, 36, 12]);
    const mrrv = P[sg].tk * Math.exp(N(.45)) * (stage === 'Negociação' ? 1.1 : 1);
    const day = rd(U(18, 30)) + (R() < .45 ? 30 : 0);
    deals.push({ id: 10200 + j * 7 + rd(U(0, 6)), cli: `Cliente ${10200 + j * 7}`, sg, owner: owner.n, stage, temp, mrr: mrrv, close: day <= 30 ? `${day}/11` : `${Math.min(31, day - 30)}/12`, closeThis: day <= 30, dOpp: rd(U(2, 110)), canal: wpick(CANAIS_CONV, [26, 24, 18, 8, 16, 8]) });
  }
  deals.sort((a, b) => b.mrr - a.mrr);

  // ---------- perdas ----------
  const LOSS = [['Não é prioridade agora', 21], ['Lead não retorna', 18], ['Sem budget', 16], ['Optou por outra ferramenta', 14], ['Sem fit / fora do ICP', 11], ['Timing', 8], ['Funcionalidade faltando', 7], ['Preço', 5]];
  const lostDeals = [];
  for (let j = 0; j < 24; j++) { const sg = R() < .8 ? 'smb' : 'ent'; lostDeals.push({ cli: `Cliente ${9100 + j * 13}`, sg, owner: pick(AE.filter(a => a.sg === sg)).n, motivo: wpick(LOSS.map(x => x[0]), LOSS.map(x => x[1])), quando: R() < .38 ? 'Antes da OPP' : 'Depois da OPP', mrr: P[sg].tk * Math.exp(N(.4)), dia: `${pick(BDAYS.slice(0, DU))}/11`, canal: wpick(CANAIS_CONV, [26, 24, 18, 8, 16, 8]) }); }
  lostDeals.sort((a, b) => b.mrr - a.mrr);

  // ---------- canais e mídia ----------
  const MQL_CH = [['Google Ads', .36], ['Meta Ads', .18], ['LinkedIn Ads', .07], ['Orgânico', .21], ['Direto', .08], ['E-mail', .05], ['Indicação', .05]];
  const MEDIA = [{ n: 'Google Ads', inv: 7800, cpm: 22, ctr: .031, cvr: .055 }, { n: 'Meta Ads', inv: 3900, cpm: 9, ctr: .012, cvr: .07 }, { n: 'LinkedIn Ads', inv: 2400, cpm: 48, ctr: .006, cvr: .04 }];
  const MSH = { 'Google Ads': .36, 'Meta Ads': .18, 'LinkedIn Ads': .07 };
  const media = months.map((mo, i) => MEDIA.map(c => {
    let inv = c.inv * (1 + .01 * i) * SEAS[mo.m] * (1 + N(.05)); if (i === CUR) inv *= PACE * 1.03;
    const fa = { leads: F.smb[i].leads + F.ent[i].leads, mql: F.smb[i].mql + F.ent[i].mql };
    const mql = fa.mql * MSH[c.n] * (1 + N(.04)), leads = fa.leads * MSH[c.n] * (1 + N(.05));
    const clicks = leads / (c.cvr * (1 + N(.06))), impr = clicks / (c.ctr * (1 + N(.05)));
    return { n: c.n, inv, impr, clicks, leads, mql };
  }));
  const site = months.map((mo, i) => { let ses = 21000 * (1 + .008 * i) * SEAS[mo.m] * (1 + N(.04)); if (i === CUR) ses *= PACE * 1.0; return { ses, users: ses * .78, conv: ses * .021, gscClicks: ses * .34, gscImpr: ses * 9.8, pos: 14.2 - i * .12 + N(.3) }; });
  const email = months.map((mo, i) => { let env = 48000 * (1 + .005 * i) * (1 + N(.08)); if (i === CUR) env *= PACE; return { env, open: .31 + N(.012), click: .026 + N(.002), bounce: .008 + N(.0008), unsub: .0021 + N(.0003) }; });
  const EMAILS = ['Newsletter de novembro', 'Convite: webinar de cortes com IA', 'Reativação de base inativa', 'Novidades do produto', 'Case: agência de conteúdo', 'Nutrição: teste grátis dia 3', 'Nutrição: teste grátis dia 7', 'Black Friday: plano anual'];
  const emailCamp = EMAILS.map(n => { const env = rd(U(1500, 8000)); const op = U(.22, .44), cl = U(.012, .05); return { n, env, op, cl, mql: rd(env * cl * U(.04, .11)) }; });
  const campaigns = (() => {
    const raw = Array.from({ length: 22 }, (_, j) => { const ch = wpick(['Google Ads', 'Meta Ads', 'LinkedIn Ads'], [55, 30, 15]); return { n: `Campanha ${String(j + 1).padStart(2, '0')}`, ch, w: Math.exp(N(.7)), e: Math.exp(N(.45)) }; });

      g += `<path d="${d}" fill="url(#${u}a${k})"/><g class="mesh">${Array.from({ length: 14 }, (_, q) => { const f = 1 - (q + 1) / 15; return `<path d="${smoothPath(P.map(([px, py]) => [px, base - (base - py) * f]))}" fill="none" stroke="${s.color}" stroke-width=".9" opacity="${(.8 * (1 - q / 14)).toFixed(2)}"/>`; }).join('')}</g>`; });
  });
  series.forEach((s, k) => { g += `<path d="${runs(s.vals, x, y).map(smoothPath).join('')}" fill="none" stroke="${s.color}" stroke-width="${s.dash ? 1.6 : 2.6}" stroke-linejoin="round" stroke-linecap="round" ${s.dash ? 'stroke-dasharray="4 4" opacity=".8"' : `filter="url(#${u}g${k})"`}/>`; });
  if (endLabel) { const ends = spreadY(series.map((s, k) => ({ s, k, i: lastI(s.vals) })).filter(e => e.i >= 0 && !e.s.noEnd).map(e => ({ ...e, y: y(e.s.vals[e.i]), y0: y(e.s.vals[e.i]) })), 15, pt, h - pb);
    ends.forEach(e => { g += endDot(x(e.i), e.y0, e.s.color) + `<text x="${x(e.i) + 13}" y="${e.y + 4}" class="endl" fill="${e.s.color}">${labelAll && e.s.name ? e.s.name + ': ' : ''}${F(e.s.vals[e.i])}</text>`; }); }
  const hw = (W - pl - pr) / Math.max(1, n - 1);
  g += labels.map((l, i) => `<rect x="${x(i) - hw / 2}" y="0" width="${hw}" height="${h - pb}" fill="transparent" ${tipA(`<b>${l}</b>` + series.map(s => `<div class="r"><span>${keyI(s.color, 1, s.dash)}${s.name || ''}</span><span>${s.vals[i] == null ? '—' : F(s.vals[i])}</span></div>`).join(''))}/>`).join('');
  const lg = legend && (series.length > 1 || bars) ? legendH([...series.map(s => ({ n: s.name || '', c: s.color, line: 1, dash: s.dash })), ...(bars ? [{ n: bars.name, c: bars.color }] : [])]) : '';
  return `<div class="chart pc" data-ch="${cid}">${lg}<svg viewBox="0 0 ${W} ${h}" width="100%"><defs>${series.map((s, k) => fxDefs(u, s.color, k)).join('')}</defs>${g}</svg></div>`;
};

/* colunas: trilho atrás de cada coluna, degradê que some na base, coluna em foco acesa com rótulo flutuante; stacked, agrupada ou com projeção listrada */
const barChart = (cfg) => { const { labels, series, h = 220, fmt = 'N', stacked = false, lines = [], mark, every, hatchFrom, W = 760, legend = true, totals = false } = cfg;
  const u = vid(), cid = chId('bar', cfg), F = VF(fmt), A = AXF[fmt] || AXF.N, n = labels.length;
  const pl = 50, pr = lines.length ? 84 : 12, pt = 34, pb = 26, bw = (W - pl - pr) / Math.max(n, 1);
  const tot = labels.map((_, i) => stacked ? series.reduce((a, s) => a + Math.max(0, s.vals[i] || 0), 0) : Math.max(0, ...series.map(s => s.vals[i] || 0)));
  const { y, ticks, step } = scaleY([...tot, ...series.flatMap(s => s.vals.filter(v => v < 0)), ...lines.flatMap(l => l.vals)], h, pt, pb, true);
  const cx = i => pl + bw * i + bw / 2, grp = !stacked && series.length > 1, cw = Math.max(5, Math.min(grp ? 18 : 30, bw * (grp ? .8 / series.length : .62)));
  const foc = mark != null && mark >= 0 ? mark : lastI(tot.map(v => v || null)), ev = every || Math.ceil(n / Math.max(2, Math.floor((W - pl - pr) / 52)));
  const col = (x0, y0, y1, w, r = 6) => { const hh = Math.max(0, y0 - y1), rr = Math.min(r, hh, w / 2); return `M${x0},${y0}V${y1 + rr}Q${x0},${y1} ${x0 + rr},${y1}H${x0 + w - rr}Q${x0 + w},${y1} ${x0 + w},${y1 + rr}V${y0}Z`; };
  let defs = `<linearGradient id="${u}tr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F3F2EE" stop-opacity=".06"/><stop offset="1" stop-color="#F3F2EE" stop-opacity=".005"/></linearGradient><filter id="${u}gl" x="-60%" y="-20%" width="220%" height="140%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>`;
  series.forEach((s, k) => { defs += `<linearGradient id="${u}d${k}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${s.color}" stop-opacity="${stacked ? .9 : .55}"/><stop offset="1" stop-color="${s.color}" stop-opacity="${stacked ? .32 : .1}"/></linearGradient><linearGradient id="${u}D${k}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${s.color}"/><stop offset="1" stop-color="${s.color}" stop-opacity=".45"/></linearGradient><pattern id="${u}p${k}" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="${s.color}" opacity=".12"/><line x1="0" y1="0" x2="0" y2="6" stroke="${s.color}" stroke-opacity=".55" stroke-width="2.2"/></pattern>`; });
  let g = `<g class="axis">${ticks.map(t => `<line class="grd" x1="${pl}" x2="${W - pr}" y1="${y(t)}" y2="${y(t)}"/><text x="${pl - 8}" y="${y(t) + 3.5}" text-anchor="end">${A(t, step)}</text>`).join('')}${labels.map((l, i) => i % ev === 0 || i === foc ? `<text x="${cx(i)}" y="${h - 7}" text-anchor="middle" class="${i === foc ? 'cur' : ''}">${l}</text>` : '').join('')}</g>`;
  const tw = grp ? cw * series.length + 4 : cw;
  g += labels.map((_, i) => `<rect x="${cx(i) - tw / 2}" y="${pt - 6}" width="${tw}" height="${h - pt - pb + 6}" rx="${Math.min(8, tw / 2)}" fill="url(#${u}tr)"/>`).join('');
  labels.forEach((_, i) => {
    const on = i === foc; let s0 = `<g ${on ? `filter="url(#${u}gl)"` : ''} opacity="${on || mark == null ? 1 : .8}">`;
    if (stacked) { let acc = 0; const vis = series.filter(s => (s.vals[i] || 0) > 0).length; let seen = 0;
      series.forEach((s, k) => { const v = Math.max(0, s.vals[i] || 0); if (!v) return; seen++; const y0 = y(acc), y1 = y(acc + v); acc += v; const x0 = cx(i) - cw / 2;
        s0 += seen === vis ? `<path d="${col(x0, y0, y1 + (seen > 1 ? 0 : 0), cw)}" fill="url(#${u}${on ? 'D' : 'd'}${k})"/>` : `<rect x="${x0}" y="${y1}" width="${cw}" height="${Math.max(0, y0 - y1 - 1.5)}" rx="1" fill="url(#${u}${on ? 'D' : 'd'}${k})"/>`; });
    } else series.forEach((s, k) => { const v = s.vals[i]; if (v == null || !v) return; const x0 = grp ? cx(i) - tw / 2 + 2 + k * cw : cx(i) - cw / 2, w = grp ? cw - 1.5 : cw;
      const hatch = hatchFrom != null && i >= hatchFrom && k === 0;
      s0 += v >= 0 ? `<path d="${col(x0, y(0), y(v), w)}" fill="url(#${u}${hatch ? 'p' : on ? 'D' : 'd'}${k})" ${hatch ? `stroke="${s.color}" stroke-opacity=".5"` : ''}/>` : `<rect x="${x0}" y="${y(0)}" width="${w}" height="${y(v) - y(0)}" rx="3" fill="url(#${u}d${k})"/>`; });
    g += s0 + '</g>';
  });
  lines.forEach(l => { g += `<path d="${runs(l.vals, cx, y).map(smoothPath).join('')}" fill="none" stroke="${l.color}" stroke-width="${l.dash ? 1.8 : 2.2}" stroke-linecap="round" ${l.dash ? 'stroke-dasharray="4 4"' : ''}/>`; });
  spreadY(lines.map(l => ({ l, i: lastI(l.vals) })).filter(e => e.i >= 0).map(e => ({ ...e, y: y(e.l.vals[e.i]), y0: y(e.l.vals[e.i]) })), 15, pt, h - pb).forEach(e => { g += endDot(cx(e.i), e.y0, e.l.color) + `<text x="${cx(e.i) + 13}" y="${e.y + 4}" class="endl" fill="${e.l.color}">${F(e.l.vals[e.i])}</text>`; });
  if (foc >= 0 && tot[foc] > 0) { const X = cx(foc), yy = y(tot[foc]), right = X < (W - pr) * .72, lx = right ? X + tw / 2 + 22 : X - tw / 2 - 22, ref = lines[0] && lines[0].vals[foc];
    g += `<g class="callout"><line x1="${X + (right ? tw / 2 : -tw / 2)}" x2="${lx + (right ? -4 : 4)}" y1="${yy}" y2="${yy}" stroke-dasharray="3 3"/><text x="${lx}" y="${yy - 2}" text-anchor="${right ? 'start' : 'end'}" class="co-v">${F(tot[foc])}</text><text x="${lx}" y="${yy + 13}" text-anchor="${right ? 'start' : 'end'}" class="co-l">${labels[foc]}${ref ? ` · ${fP(tot[foc] / ref, 0)} de ${(lines[0].name || 'meta').toLowerCase()}` : ''}</text></g>`; }
  g += labels.map((l, i) => `<rect x="${pl + bw * i}" y="0" width="${bw}" height="${h - pb}" fill="transparent" ${tipA(`<b>${l}</b>` + series.map(s => `<div class="r"><span>${keyI(s.color)}${s.name || ''}</span><span>${s.vals[i] == null ? '—' : F(s.vals[i])}</span></div>`).join('') + (stacked && series.length > 1 ? `<div class="r tt"><span>Total</span><span>${F(tot[i])}</span></div>` : '') + lines.map(L => `<div class="r"><span>${keyI(L.color, 1, L.dash)}${L.name}</span><span>${L.vals[i] == null ? '—' : F(L.vals[i])}</span></div>`).join(''))}/>`).join('');
  const sT = series.map(s => s.vals.reduce((a, b) => a + (b || 0), 0)), gT = sT.reduce((a, b) => a + b, 0);
  const lg = legend && (series.length > 1 || lines.length || hatchFrom != null) ? legendH([...series.map((s, k) => ({ n: s.name || '', c: s.color, b: totals ? F(sT[k]) : '', e: totals && gT ? fP(sT[k] / gT, 0) : '' })), ...(hatchFrom != null ? [{ n: 'Projeção', c: 'repeating-linear-gradient(135deg,#F3F2EE55 0 2px,transparent 2px 4px)' }] : []), ...lines.map(l => ({ n: l.name, c: l.color, line: 1, dash: l.dash }))]) : '';
  return `<div class="chart pc" data-ch="${cid}">${lg}<svg viewBox="0 0 ${W} ${h}" width="100%"><defs>${defs}</defs>${g}</svg></div>`;
};

/* minigráfico de cartão: curva suave, área que some, brilho, último ponto marcado */
const spark = (vals, color = '#FF6A00', w = 120, h = 28) => {
  const u = vid(), pts = vals.map((x, i) => [i, x]).filter(p => p[1] != null && isFinite(p[1])); if (pts.length < 2) return '';
  const lo = Math.min(...pts.map(p => p[1])), hi = Math.max(...pts.map(p => p[1])), sp = hi - lo || 1;
  const X = i => 2 + (w - 8) * i / (vals.length - 1), Y = v => h - 4 - (h - 8) * (v - lo) / sp, d = smoothPath(pts.map(p => [X(p[0]), Y(p[1])])), L = pts[pts.length - 1];
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}"><defs><linearGradient id="${u}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".38"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs><path d="${d}L${X(L[0])},${h}L${X(pts[0][0])},${h}Z" fill="url(#${u})"/><path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" style="filter:drop-shadow(0 2px 3px ${color}73)"/><circle cx="${X(L[0])}" cy="${Y(L[1])}" r="3" fill="var(--panel-solid)" stroke="${color}" stroke-width="1.6"/></svg>`;
};

/* medidor de instrumento: 270°, marcas acesas até o valor */
const tickGauge = (v, size = 74, n = 36) => { const c = size / 2, R1 = c - 6, R2 = c - 12, a0 = 135, sp = 270;
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" class="gauge"><circle cx="${c}" cy="${c}" r="${c - 1.5}" class="g-bezel"/><circle cx="${c}" cy="${c}" r="${R2 - 5}" class="g-face"/>${Array.from({ length: n + 1 }, (_, i) => { const a = (a0 + sp * i / n) * Math.PI / 180, on = i / n <= v + 1e-9 && v > 0; return `<line x1="${(c + Math.cos(a) * R2).toFixed(1)}" y1="${(c + Math.sin(a) * R2).toFixed(1)}" x2="${(c + Math.cos(a) * R1).toFixed(1)}" y2="${(c + Math.sin(a) * R1).toFixed(1)}" class="gt${on ? ' on' : ''}"/>`; }).join('')}</svg>`; };
const ring = (p) => `<div class="ps-ring">${tickGauge(Math.max(0, Math.min(1, p || 0)))}<span>${isFinite(p) ? fP(p, 0) : '—'}</span></div>`;

/* medidor de meta (semicírculo vermelho → verde com ponteiro) */
const gauge = (p, label, sub) => {
  const a = Math.PI * (1 - Math.max(0, Math.min(1, p))), cx = 90, cy = 86, R = 64, u = vid();
  const arc = (f0, f1) => { const A0 = Math.PI * (1 - f0), A1 = Math.PI * (1 - f1); return `M${cx + R * Math.cos(A0)} ${cy - R * Math.sin(A0)} A${R} ${R} 0 0 1 ${cx + R * Math.cos(A1)} ${cy - R * Math.sin(A1)}`; };
  const col = p >= .8 ? 'var(--good)' : p >= .5 ? 'var(--warn)' : 'var(--bad)';
  return `<svg viewBox="0 0 180 124" width="100%" style="max-width:240px;display:block;margin:0 auto"><defs><linearGradient id="${u}" x1="0" x2="1"><stop offset="0" stop-color="#F2766B"/><stop offset=".55" stop-color="#E3A84A"/><stop offset="1" stop-color="#4CC38A"/></linearGradient></defs><path d="${arc(0, 1)}" stroke="url(#${u})" stroke-width="13" fill="none" stroke-linecap="round" opacity=".9"/><line x1="${cx}" y1="${cy}" x2="${cx + (R - 18) * Math.cos(a)}" y2="${cy - (R - 18) * Math.sin(a)}" stroke="#F3F2EE" stroke-width="3.5" stroke-linecap="round"/><circle cx="${cx}" cy="${cy}" r="6" fill="#F3F2EE"/><text x="${cx}" y="${cy + 30}" text-anchor="middle" fill="${col}" font-size="25" font-weight="700">${fP(p, 0)}</text></svg><div style="text-align:center;font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-3)">${label}</div>${sub ? `<div class="hint" style="text-align:center;margin-top:2px">${sub}</div>` : ''}`;
};

/* composição: rosca grossa + linhas com barra de participação */
const donut = (parts, center, sub) => {
  const list = parts.filter(p => p.v > 0), tot = list.reduce((a, p) => a + p.v, 0) || 1, size = 160, R = size / 2 - 14, C = 2 * Math.PI * R; let acc = 0;
  const segs = list.map(p => { const len = C * p.v / tot, el = `<circle cx="${size / 2}" cy="${size / 2}" r="${R}" fill="none" stroke="${p.c}" stroke-width="20" stroke-dasharray="${Math.max(0, len - 3)} ${C}" stroke-dashoffset="${-acc}" transform="rotate(-90 ${size / 2} ${size / 2})" class="seg" ${tipA(`<b>${p.l}</b>${fN(p.v)} · ${fP(p.v / tot, 0)}`)}/>`; acc += len; return el; }).join('');
  return `<div class="bd"><svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${size / 2}" cy="${size / 2}" r="${R}" fill="none" class="trk" stroke-width="20"/>${segs}<text x="${size / 2}" y="${size / 2 + 3}" text-anchor="middle" class="bd-c">${center}</text><text x="${size / 2}" y="${size / 2 + 21}" text-anchor="middle" class="bd-s">${sub || 'total'}</text></svg><div class="bd-rows">${list.map(p => `<div class="bd-r"><span class="bd-k" style="background:${p.c}"></span><span class="bd-l">${p.l}</span><b class="bd-v">${p.t ?? fN(p.v)}</b><span class="bd-p">${fP(p.v / tot, 0)}</span><span class="bd-bar"><i style="width:${100 * p.v / tot}%;background:${p.c}"></i></span></div>`).join('')}</div></div>`;
};

/* barras horizontais com degradê e brilho na ponta; mk = marcador (meta) */
const hbars = (rows, o = {}) => { const mx = o.max || Math.max(...rows.map(r => Math.abs(r.v)), 1);
  return `<div class="hbars">${rows.map(r => `<div class="hb"><span class="hb-l">${r.l}${r.sub ? `<small>${r.sub}</small>` : ''}</span><div class="hb-t">${r.ref != null ? `<div class="hb-g" style="width:${Math.min(100, 100 * r.ref / mx)}%"></div>` : ''}<div class="hb-f" style="width:${Math.max(1, 100 * Math.abs(r.v) / mx)}%;--hc:${r.c || 'var(--c1)'}"></div>${r.mk != null ? `<span class="hb-m" style="left:${Math.min(100, r.mk * 100)}%"></span>` : ''}</div><span class="hb-v">${r.t ?? fN(r.v)}${r.s ? `<em>${r.s}</em>` : ''}</span></div>`).join('')}</div>`; };
const bar = (p, color = 'var(--c1)', mk) => `<div class="hb-t"><div class="hb-f" style="width:${Math.max(0, Math.min(100, p * 100))}%;--hc:${color}"></div>${mk != null ? `<span class="hb-m" style="left:${Math.min(100, mk * 100)}%"></span>` : ''}</div>`;

/* pílula de variação */
const dchip = (d, good = 1, pp) => d == null || !isFinite(d) ? '' : `<span class="d ${Math.abs(d) < .0005 ? 'flat' : d * good > 0 ? 'up' : 'down'}">${d >= 0 ? '+' : ''}${pp ? (d * 100).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' p.p.' : (d * 100).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + '%'}</span>`;
/* cartão de número: rótulo, valor, pílula de variação, linha de apoio e minigráfico */
const kpi = (l, v, s = '', o = {}) => `<div class="card k ${o.cls || ''}" ${o.go ? `data-go="${o.go}" role="button" tabindex="0"` : ''}><div class="l">${l}${o.per ? `<span>${o.per}</span>` : ''}</div><div class="v ${o.lg ? 'lg' : ''}" ${o.color ? `style="color:${o.color}"` : ''}>${v}</div>${o.d != null ? dchip(o.d, o.good ?? 1, o.pp) : ''}${s ? `<div class="s">${s}</div>` : ''}${o.spark ? spark(o.spark, o.sc || 'var(--c1)', 132, 30) : ''}${o.extra || ''}${o.go ? '<span class="go">ver detalhe →</span>' : ''}</div>`;

/* funil em fatias curvas com os cartões de cada etapa ao lado: steps [{l, v, prev, goal, convGoal, sub, money}] */
const funnelViz = (all, cmpLabel = 'comparação') => {
  const steps = all.filter(s => !s.money), u = vid(), n = steps.length, W = 480, SW = 350, cx = SW / 2 + 6, rowH = 76, gap = 8, H = n * rowH + (n - 1) * gap + 8;
  const mx = Math.max(...steps.map(s => Math.max(s.v || 0, s.prev || 0)), 1), wOf = v => 64 + (SW - 64) * Math.sqrt(Math.max(0, v || 0) / mx);
  const slice = (y, wt, wb) => { const xt = cx - wt / 2, xb = cx - wb / 2, k = rowH * .55; return `M${xt},${y} L${xt + wt},${y} C${xt + wt},${y + k} ${xb + wb},${y + rowH - k} ${xb + wb},${y + rowH} L${xb},${y + rowH} C${xb},${y + rowH - k} ${xt},${y + k} ${xt},${y} Z`; };
  const ys = i => 4 + i * (rowH + gap), temPrev = steps.some(s => s.prev != null);
  let svg = `<defs><linearGradient id="${u}g" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="${H}"><stop offset="0" stop-color="var(--fv-a)"/><stop offset="1" stop-color="var(--fv-b)"/></linearGradient><linearGradient id="${u}s" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".2"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><pattern id="${u}h" width="4" height="8" patternUnits="userSpaceOnUse"><rect width="1.1" height="8" fill="#000" opacity=".08"/></pattern><filter id="${u}f" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>`;
  if (temPrev) svg += steps.map((s, i) => s.prev != null ? `<path d="${slice(ys(i), wOf(s.prev), i < n - 1 ? wOf(steps[i + 1].prev ?? s.prev) : wOf(s.prev) * .78)}" class="fv-ghost"/>` : '').join('');
  svg += `<g filter="url(#${u}f)">${steps.map((s, i) => { const d = slice(ys(i), wOf(s.v), i < n - 1 ? wOf(steps[i + 1].v) : wOf(s.v) * .78); return `<g ${tipA(`<b>${s.l}</b>${fN(s.v)}${s.prev != null ? ` · ${cmpLabel}: ${fN(s.prev)}` : ''}`)}><path d="${d}" fill="url(#${u}g)"/><path d="${d}" fill="url(#${u}h)"/><path d="${d}" fill="url(#${u}s)"/></g>`; }).join('')}</g>`;
  svg += steps.map((s, i) => { const y = ys(i), wt = wOf(s.v); return `<line x1="${cx - wt / 2 + 6}" x2="${cx + wt / 2 - 6}" y1="${y + .5}" y2="${y + .5}" class="fv-edge"/><text x="${cx}" y="${y + rowH / 2 + 1}" text-anchor="middle" class="fv-n">${fN(s.v)}</text><text x="${cx}" y="${y + rowH / 2 + 18}" text-anchor="middle" class="fv-l">${s.l.toUpperCase()}</text>`; }).join('');
  svg += steps.map((s, i) => { if (!i) return ''; const c = s.v / (steps[i - 1].v || 1), y = ys(i) - gap / 2, xe = cx + Math.max(wOf(s.v), s.prev != null ? wOf(s.prev) : 0) / 2 + 14; return `<g class="fv-cv"><line x1="${xe - 10}" x2="${xe + 6}" y1="${y}" y2="${y}"/><rect x="${xe + 6}" y="${y - 11}" width="62" height="22" rx="11"/><text x="${xe + 37}" y="${y + 4}" text-anchor="middle">${c > 1 ? '>100%' : fP(c, c < .1 ? 1 : 0)}</text></g>`; }).join('');
  if (temPrev) svg += `<text x="${W - 4}" y="${H - 4}" text-anchor="end" class="fv-lg">tracejado = ${cmpLabel}</text>`;
  const cards = all.map((s, i) => { const conv = i && !s.money ? s.v / (all[i - 1].v || 1) : null, fm = s.money ? fR : fN, d = s.prev ? (s.v - s.prev) / s.prev : null, tone = Math.round(100 - 100 * Math.min(1, i / Math.max(1, n - 1)));
    return `<div class="fvc ${s.money ? 'money' : ''}" style="border-left-color:${s.money ? 'var(--good)' : `color-mix(in srgb,var(--fv-a) ${tone}%,var(--fv-b))`}"><div class="fvc-h"><b>${s.l}</b><span class="fvc-v">${fm(s.v)}</span>${s.goal ? `<span class="fvc-g ${s.v >= s.goal ? 'pos' : 'neg'}">${fP(s.v / s.goal, 0)} da meta no ritmo</span>` : ''}</div><div class="fvc-s">${conv != null ? `<span>${conv > 1 ? 'acima de 100%' : fP(conv, conv < .1 ? 1 : 0)} da etapa anterior</span>` : ''}${conv != null && s.convGoal ? `<span class="fvc-g ${conv >= s.convGoal ? 'pos' : 'neg'}">meta ${fP(s.convGoal, 0)} (${conv >= s.convGoal ? '+' : ''}${((conv - s.convGoal) * 100).toLocaleString('pt-BR', { maximumFractionDigits: 1 })} p.p.)</span>` : ''}${s.sub ? `<span>${s.sub}</span>` : ''}</div>${s.prev != null ? `<div class="fvc-s">${dchip(d)}<span>${cmpLabel}: ${fm(s.prev)}</span></div>` : ''}</div>`; }).join('');
  return `<div class="fviz"><svg viewBox="0 0 ${W} ${H}">${svg}</svg><div class="fviz-cards">${cards}</div></div>`;
};

/* ponte (cascata): steps [{l, v, total}] */
const waterfall = (steps, fmt = 'R', h = 260, W = 760) => {
  const u = vid(), cid = chId('wf', { steps, fmt, h, W }), F = VF(fmt), A = AXF[fmt] || AXF.N, pl = 56, pr = 12, pt = 22, pb = 34, n = steps.length, bw = (W - pl - pr) / n, cw = Math.max(10, Math.min(34, bw * .5));
  let acc = 0; const segs = steps.map(s => { if (s.total) { acc = s.v; return { ...s, a: 0, b: s.v }; } const a = acc; acc += s.v; return { ...s, a, b: acc }; });
  const vals = segs.flatMap(s => [s.a, s.b]), mx = Math.max(...vals), mn = Math.min(...vals), lo0 = Math.min(...segs.filter(s => !s.total).flatMap(s => [s.a, s.b]), mx), span = mx - lo0;
  const cut = segs.some(s => s.total) && lo0 > 0 && span < mx * .25, { y, ticks, step } = scaleY(cut ? [lo0 - span * .6, mx] : [mn, mx], h, pt, pb, !cut);
  const top = y(ticks[ticks.length - 1]), bot = y(ticks[0]), C = { t: 'var(--c4)', up: 'var(--good)', dn: 'var(--bad)' };
  let g = `<g class="axis">${ticks.map(t => `<line class="grd" x1="${pl}" x2="${W - pr}" y1="${y(t)}" y2="${y(t)}"/><text x="${pl - 8}" y="${y(t) + 3.5}" text-anchor="end">${A(t, step)}</text>`).join('')}${segs.map((s, i) => `<text x="${pl + bw * i + bw / 2}" y="${h - 18}" text-anchor="middle">${s.l.length > 13 ? s.l.slice(0, 12) + '…' : s.l}</text>`).join('')}</g>`;
  if (cut) g += `<text x="${pl}" y="${h - 3}" class="axnote">Eixo começa em ${A(ticks[0], step)} para os movimentos aparecerem</text>`;
  g += segs.map((s, i) => { const x0 = pl + bw * i + (bw - cw) / 2, ya = Math.min(Math.max(y(Math.max(s.a, s.b)), top), bot), yb = Math.min(Math.max(y(Math.min(s.a, s.b)), top), bot), k = s.total ? 't' : s.v >= 0 ? 'up' : 'dn';
    return `<rect x="${x0}" y="${ya}" width="${cw}" height="${Math.max(1.5, yb - ya)}" rx="5" fill="url(#${u}${k})" ${tipA(`<b>${s.l}</b><div class="r"><span>${s.total ? 'Saldo' : 'Movimento'}</span><span>${F(s.v)}</span></div>${s.total ? '' : `<div class="r"><span>Saldo depois</span><span>${F(s.b)}</span></div>`}`)}/>${i < n - 1 ? `<line x1="${x0 + cw}" x2="${x0 + bw}" y1="${y(s.b)}" y2="${y(s.b)}" class="wfl"/>` : ''}<text x="${x0 + cw / 2}" y="${ya - 6}" text-anchor="middle" class="barl" style="fill:${s.total ? 'var(--fg)' : C[k]}">${(s.total || s.v < 0 ? '' : '+') + F(s.v).replace('R$ ', '')}</text>`; }).join('');
  return `<div class="chart" data-ch="${cid}">${legendH([{ n: 'Saldo (início e fim)', c: C.t }, { n: 'Aumenta', c: C.up }, { n: 'Diminui', c: C.dn }])}<svg viewBox="0 0 ${W} ${h}" width="100%"><defs>${Object.entries(C).map(([k, c]) => `<linearGradient id="${u}${k}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c}"/><stop offset="1" stop-color="${c}" stop-opacity=".55"/></linearGradient>`).join('')}</defs>${g}</svg></div>`;
};

/* mix 100% por linha: rows [{l, parts:[v], sub}] */
const mixBars = (rows, names, colors, fmt = 'N') => { const F = VF(fmt), tots = names.map((_, i) => rows.reduce((t, r) => t + (r.parts[i] || 0), 0)), gt = tots.reduce((a, b) => a + b, 0) || 1;
  return `<div class="mix">${legendH(names.map((n, i) => ({ n, c: colors[i] })))}${rows.map(r => { const t = r.parts.reduce((a, b) => a + (b || 0), 0) || 1; return `<div class="mx-r"><span class="mx-l">${r.l}<em>${r.sub ?? F(t)}</em></span><div class="mx-t">${r.parts.map((v, i) => v > 0 ? `<div class="mx-s" style="width:${100 * v / t}%;background:linear-gradient(180deg,color-mix(in srgb,${colors[i]} 82%,#fff),${colors[i]})" ${tipA(`<b>${r.l} · ${names[i]}</b>${F(v)} · ${fP(v / t, 0)}`)}>${v / t >= .08 ? `<span>${v / t >= .16 ? F(v) + ' · ' : ''}${fP(v / t, 0)}</span>` : ''}</div>` : '').join('')}</div></div>`; }).join('')}</div>`; };

/* faixa do Pace: um cartão por etapa (anel de marcas, barra-bala, linhas do diário) */
const toneOf = r => r == null || !isFinite(r) ? 'flat' : r >= 1 ? 'good' : r >= .9 ? 'warn' : 'bad';
const slP = (r, flat) => r == null || !isFinite(r) ? '<i class="ps-sl flat">—</i>' : `<i class="ps-sl ${flat ? 'flat' : toneOf(r)}">${fP(r, 0)}</i>`;
const paceStrip = (rows, o = {}) => `<div class="ps">${rows.map(e => { const f = e.money ? fR : fN, r = e.rp, tem = e.meta > 0, w = x => Math.max(0, Math.min((x || 0) / (e.meta || 1), 1)) * 100 + '%';
  const nec = e.necDia != null ? (e.money ? fR(e.necDia) : (Math.ceil(e.necDia * 10) / 10).toLocaleString('pt-BR')) : '—';
  return `<div class="ps-k ${toneOf(r)} ${e.go ? 'clk' : ''}" ${e.go ? `data-go="${e.go}"` : ''}><div class="ps-h"><span><b>${e.l}</b><small>${e.def || ''}</small></span><span class="ps-pill ${toneOf(r)}">${r != null ? fP(r, 0) + ' do pace' : 'sem meta'}</span></div>
    <div class="ps-b"><div><div class="ps-big">${f(e.real)}</div><div class="ps-of">${tem ? `${o.metaNome || 'meta'} ${f(e.meta)}` : 'sem meta'}</div>${e.conv != null ? `<div class="ps-cv"><b>${fP(e.conv, 0)}</b> ${e.convL}</div>` : ''}${e.ant != null ? `<div class="ps-vs">${dchip((e.real - e.ant) / (e.ant || 1))} vs ${o.vsL || 'anterior'} <small>(${f(e.ant)})</small></div>` : ''}</div>${ring(r)}</div>
    ${tem ? `<div class="ps-bul" style="--bc:var(--${toneOf(r) === 'good' ? 'good' : toneOf(r) === 'warn' ? 'warn' : 'bad'})"><div class="ps-bt"><i class="rit" style="width:${w(e.proj)}"></i><i class="real" style="width:${w(e.real)}"></i><i class="pc" style="left:calc(${w(e.pace)} - 1px)"></i></div><div class="ps-bs"><span>0</span><span>${o.metaNome || 'meta'} ${f(e.meta)}</span></div></div>` : ''}
    <dl class="ps-rows"><dt>Pace hoje</dt><dd>${f(e.pace)}</dd><dd class="p">${slP(r)}</dd><dt>${o.refL || 'Hoje'} / nec. por dia</dt><dd>${f(e.hoje)} / ${nec}</dd><dd class="p">${slP(e.necDia ? e.hoje / e.necDia : null)}</dd><dt>No ritmo atual</dt><dd>${f(e.proj)}</dd><dd class="p">${slP(tem ? e.proj / e.meta : null)}</dd><dt>Com a meta diária</dt><dd>${f(e.metaDia)}</dd><dd class="p">${slP(tem ? e.metaDia / e.meta : null)}</dd><dt>Falta p/ ${o.metaNome || 'meta'}</dt><dd>${f(Math.max(0, e.meta - e.real))}</dd><dd class="p">${slP(tem ? Math.max(0, e.meta - e.real) / e.meta : null, 1)}</dd></dl>
    ${e.go ? `<span class="go">ver ${e.k === 'mql' ? 'MQLs' : 'deals'} →</span>` : ''}</div>`; }).join('')}</div>`;

/* dica flutuante única para todos os gráficos (data-tip) */
(() => { let tip; document.addEventListener('mousemove', (e) => { const t = e.target.closest && e.target.closest('[data-tip]'); if (!tip) { tip = document.createElement('div'); tip.className = 'vtip'; document.body.appendChild(tip); }
  if (!t) { tip.style.opacity = 0; return; } tip.innerHTML = t.getAttribute('data-tip'); tip.style.opacity = 1; const r = tip.getBoundingClientRect(); let x = e.clientX + 16, y = e.clientY + 14; if (x + r.width > innerWidth - 8) x = e.clientX - r.width - 16; if (y + r.height > innerHeight - 8) y = e.clientY - r.height - 12; tip.style.left = x + 'px'; tip.style.top = y + 'px'; }); })();

/* redesenha cada gráfico na largura real do cartão (como o useWidth do produto): o texto do eixo não cresce com o cartão */
function fitCharts(root = document) {
  root.querySelectorAll('[data-ch]').forEach(el => { const c = CHS[el.dataset.ch]; if (!c) return; const w = Math.round(el.clientWidth), cur = c.f === 'wf' ? (c.cfg.W || 760) : (c.cfg.W || 760);
    if (w < 60 || Math.abs(w - cur) < 6) return; const W = Math.max(280, w);
    el.outerHTML = c.f === 'line' ? lineChart({ ...c.cfg, W }) : c.f === 'bar' ? barChart({ ...c.cfg, W }) : waterfall(c.cfg.steps, c.cfg.fmt, c.cfg.h, W); });
}
let _fitT; window.addEventListener('resize', () => { clearTimeout(_fitT); _fitT = setTimeout(() => fitCharts(), 120); });

/* cartão de tendência: valor atual, variação contra o anterior e a curva */
const trendCard = (title, labels, vals, fmt = 'P', good = 1, note) => { const last = vals[vals.length - 1], prev = vals[vals.length - 2], d = last - prev, F = fmt === 'P' ? (x) => fP(x, 1) : VF(fmt);
  return `<div class="card tc"><div class="tc-h"><span>${title}</span><b>${F(last)}</b><em class="${d * good >= 0 ? 'up' : 'down'}">${d >= 0 ? '▲' : '▼'} ${fmt === 'P' ? (Math.abs(d * 100)).toFixed(1).replace('.', ',') + ' p.p.' : F(Math.abs(d))} vs anterior</em></div>${lineChart({ labels, series: [{ name: title, color: '#FF8A3D', vals, area: 1 }], fmt, h: 140, endLabel: false, min0: false, legend: false })}${note ? `<p class="hint">${note}</p>` : ''}</div>`; };

/* ampulheta: à esquerda a aquisição afunila até a venda; à direita, o que a base faz depois (MRR). Cada lado com a própria escala (raiz). */
const hourglass = (left, right = [], o = {}) => {
  const W = o.W || 1000, H = o.H || 330, mid = H / 2 + (right.length ? 24 : 6), n = left.length + right.length, cw = W / n, u = vid();
  const mxL = Math.max(...left.map(s => s.v || 0), 1), mxR = Math.max(...right.map(s => Math.abs(s.v || 0)), 1), hOf = (v, mx) => 22 + (H - 110) * Math.sqrt(Math.abs(v || 0) / mx);
  const pts = [...left.map((s, i) => ({ ...s, side: 'L', x: cw * i + cw / 2, h: hOf(s.v, mxL) })), ...right.map((s, i) => ({ ...s, side: 'R', x: cw * (left.length + i) + cw / 2, h: hOf(s.v, mxR) }))];
  let g = `<defs><linearGradient id="${u}L" x1="0" x2="1"><stop offset="0" stop-color="#FFB27A"/><stop offset="1" stop-color="#FF6A00"/></linearGradient><linearGradient id="${u}R" x1="0" x2="1"><stop offset="0" stop-color="#FF6A00"/><stop offset="1" stop-color="#C9B8A6"/></linearGradient><pattern id="${u}H" width="4" height="8" patternUnits="userSpaceOnUse"><rect width="1.2" height="8" fill="#000" opacity=".1"/></pattern><filter id="${u}G" x="-10%" y="-30%" width="120%" height="160%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>`;
  if (right.length) g += `<text x="${cw * left.length / 2}" y="16" text-anchor="middle" class="hg-t">AQUISIÇÃO · quantidade</text><text x="${cw * left.length + cw * right.length / 2}" y="16" text-anchor="middle" class="hg-t">BASE DE CLIENTES · MRR</text>`;
  g += `<g filter="url(#${u}G)">${pts.slice(0, -1).map((p, i) => { const q = pts[i + 1], mx = (p.x + q.x) / 2; const d = `M${p.x},${mid - p.h / 2} C${mx},${mid - p.h / 2} ${mx},${mid - q.h / 2} ${q.x},${mid - q.h / 2} L${q.x},${mid + q.h / 2} C${mx},${mid + q.h / 2} ${mx},${mid + p.h / 2} ${p.x},${mid + p.h / 2} Z`; return `<path d="${d}" fill="url(#${u}${q.side})" opacity=".92"/><path d="${d}" fill="url(#${u}H)"/>`; }).join('')}</g>`;
  g += pts.map((p, i) => `<g ${tipA(`<b>${p.l}</b>${p.money ? fR(p.v) : fN(p.v)}`)}><rect x="${p.x - cw / 2}" y="24" width="${cw}" height="${H - 24}" fill="transparent"/><line x1="${p.x}" x2="${p.x}" y1="${mid - p.h / 2 - 6}" y2="${mid + p.h / 2 + 6}" stroke="#0B0B0A" stroke-width="2.5"/><text x="${p.x}" y="${mid - p.h / 2 - 26}" text-anchor="middle" class="hg-v">${p.lab ?? (p.money ? (p.v < 0 ? '−' : '') + fR(Math.abs(p.v)) : fN(p.v))}</text><text x="${p.x}" y="${mid - p.h / 2 - 12}" text-anchor="middle" class="hg-l">${p.l}</text>${p.sub ? `<text x="${p.x}" y="${mid + p.h / 2 + 20}" text-anchor="middle" class="hg-s">${p.sub}</text>` : ''}${p.sub2 ? `<text x="${p.x}" y="${mid + p.h / 2 + 35}" text-anchor="middle" class="hg-s ${p.tone || ''}">${p.sub2}</text>` : ''}${i > 0 && p.side === 'L' ? `<rect x="${p.x - cw / 2 - 22}" y="${mid - 10}" width="44" height="20" rx="10" class="hg-cb"/><text x="${p.x - cw / 2}" y="${mid + 4}" text-anchor="middle" class="hg-c">${fP(p.v / (pts[i - 1].v || 1), p.v / pts[i - 1].v < .1 ? 1 : 0)}</text>` : ''}</g>`).join('');
  return `<div class="hg"><svg viewBox="0 0 ${W} ${H}" width="100%">${g}</svg></div>`;
};

/* Telas: Início, Marketing e Pre-sales & Sales */
const cap = (t) => t[0].toUpperCase() + t.slice(1);
const STN = { mql: 'MQL', sql: 'SQL', opp: 'OPP', won: 'WON', bk: 'Bookings' };
const yr = (i) => D.months[i].y;
const range = (a, b) => Array.from({ length: b - a + 1 }, (_, k) => a + k);
const last12 = (i) => range(i - 11, i);
const isEst = () => S.prof === 'est';
const endB = (sg, i) => { const m = D.mrr(sg, i), b = D.mrrB(sg, i); return m.start + b.bookings + b.expansion + b.reduction + b.churn; };
const mediaSum = (i, sg) => { const share = sg === 'all' ? 1 : D.f(sg, i).mql / D.f('all', i).mql; const t = { inv: 0, impr: 0, clicks: 0, leads: 0, mql: 0 }; D.media[i].forEach(c => { for (const k in t) t[k] += c[k] * share; }); return t; };

/* ================= INÍCIO ================= */
screen({

    const iE = c.cur ? D.PREV : c.i, mE = D.mrr(sg, iE), grow = mE.end / D.mrr(sg, iE - 12).end - 1;

    const att = ALERTS.slice(0, 3);
    const br = (l, sub, v, f, inv) => { const r = f ? (inv ? (v / (f * c.pace)) : v / (f * c.pace)) : null; return `<div class="bridge"><div>${l}<em>${sub}</em></div><div class="vl ${v >= 0 ? 'up' : 'dn'}">${fR(v, true)}</div>${bar(Math.min(1, Math.abs(r || 0)), inv ? '#F2766B' : '#4CC38A')}<div class="pc">${r != null ? fP(r, 0) : ''}</div><div style="text-align:right">${r != null ? st(r, inv) : ''}</div></div>`; };

    const bk = ytd(D.f, 'bk'), bkF = ytd(D.fc, 'bk'), bkB = ytd(D.bg, 'bk');

    const yrow = (l, sub, r, mt, b, inv) => ({ l: `${l}<span class="sub">${sub}</span>`, r: fR(r), mt: mt == null ? '—' : fR(mt), b: isEst() ? fR(b) : '<span class="mu">restrito</span>', pb: isEst() ? fP(r / b, 0) : '—', s: st(inv ? r / b : r / b, inv) });

      ${kpi(`NRR · retenção líquida · ${D.months[iE].l}`, fP(nrr), `GRR ${fP(grr)} · expansão, redução e churn sobre o Starting MRR`, { lg: true, spark: last12(iE).map(i => { const x = D.mrr(sg, i); return (x.start + x.expansion + x.reduction + x.churn) / x.start; }), sc: '#4CC38A' })}
      ${kpi(`Clientes ativos · ${D.months[iE].l}`, fN(mE.clients), `ticket médio ${fR(mE.end / mE.clients)}`, { lg: true })}

    <div class="card">
      <div class="bridge tot"><div>Starting MRR<em>início do mês</em></div><div class="vl">${fR(m.start)}</div></div>

    const kids = k === 'bk' ? [] : [{ n: 'Digital', a: ad, ft: fd, mo: motAdd(sg, k, 'dig') }, { n: 'Outbound', a: ao, ft: fo, mo: motAdd(sg, k, 'out') }].map(x => ({ ...x, f: x.ft + (withMot ? x.mo : 0), k }));

  try { el.requestFullscreen?.().catch(() => { }); } catch { }
}
function closeTV() { if (!TVS) return; clearInterval(TVS.iv); TVS = null; $('.tv')?.remove(); try { if (document.fullscreenElement) document.exitFullscreen(); } catch { } }

/* Início do app */
(function init() {
  $('#alCnt').textContent = ALERTS.length;
  $('#alBtn').onclick = openAlerts;
  $('#aiBtn').onclick = () => openAI(false);
  $('#tvBtn').onclick = openTV;
  $('#fbBtn').onclick = openFeedback;
  $('#searchBtn').onclick = openPalette;
  $('#searchBtn').onkeydown = (e) => { if (e.key === 'Enter') openPalette(); };
  $('#meBtn').onclick = (e) => { e.stopPropagation(); openMenu(); };
  document.addEventListener('click', (e) => { if (!e.target.closest('.me')) $('#menu')?.remove(); });
  $('#burger').onclick = () => $('.app').classList.toggle('nav-open');
  $('.side').addEventListener('click', (e) => { if (e.target === $('.side')) $('.app').classList.remove('nav-open'); });
  const q = new URLSearchParams(location.search);
  const id = location.hash.replace(/^#\//, '') || 'overview';
  S.route = scr(id) ? id : 'overview';
  render();
  // abertura (a mesma do produto): uma vez por sessão em tela cheia; embutida no portfólio, toca quando a moldura aparece na tela
  const intro = $('#intro'); let seen = false, playing = false; try { seen = sessionStorage.getItem('norn-intro') === '1'; } catch { }
  const fit = () => { const stage = $('#abStage'); if (stage) stage.style.transform = `translate(-50%,-50%) scale(${innerWidth < innerHeight ? Math.max(innerWidth / 1920 * 1.3, .18) : Math.max(innerWidth / 1920, innerHeight / 1080)})`; };
  const reset = () => { const o = $('#intro'), n = o.cloneNode(true); o.replaceWith(n); return n; };
  window.playIntro = () => {
    if (playing || matchMedia('(prefers-reduced-motion: reduce)').matches) return; playing = true;
    const el = reset(); el.hidden = false; fit(); addEventListener('resize', fit); el.classList.add('run');
    let fim = false; const end = (fast) => { if (fim) return; fim = true; try { sessionStorage.setItem('norn-intro', '1'); } catch { } if (fast) el.classList.add('out'); setTimeout(() => { el.hidden = true; el.classList.remove('run', 'out'); playing = false; removeEventListener('resize', fit); }, fast ? 260 : 0); };
    const t = setTimeout(() => end(false), 6150); el.querySelector('#skip').onclick = () => { clearTimeout(t); end(true); };
    const key = (e) => { if (e.key === 'Escape' || e.key === 'Enter') { clearTimeout(t); end(true); removeEventListener('keydown', key); } }; addEventListener('keydown', key);
  };
  window.addEventListener('message', (e) => { if (e.data === 'norn-intro') playIntro(); });
  if (!q.has('embed') && !seen) playIntro();
  if (q.has('embed')) document.body.classList.add('embed');
})();

</script>
